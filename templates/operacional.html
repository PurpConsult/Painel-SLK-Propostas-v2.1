<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOULINK | Operação</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='soulink-header.css') }}">
  <style>
    :root{--ink:#18333d;--blue:#005f78;--cyan:#1596b2;--line:#dce8ea;--muted:#71848a;--bg:#f4f8f9;--white:#fff;--mint:#dff5e8;--yellow:#fff0be;--aqua:#dff4f7;--shadow:0 7px 22px #063a480a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,"Segoe UI",Arial,sans-serif}main{max-width:1510px;margin:auto;padding:27px 29px 50px}.page-head{margin-bottom:18px}.eyebrow{margin:0 0 7px;color:#12879e;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.page-head h1{margin:0;font-size:27px;letter-spacing:-.7px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.resumo-item{min-height:85px;padding:17px 20px;border-radius:13px}.resumo-item small{display:block;font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.resumo-item strong{display:block;margin-top:8px;font-size:24px;line-height:1}.resumo-confirmado{background:var(--mint);color:#216847}.resumo-reserva{background:var(--yellow);color:#896a18}.resumo-cotacao{background:var(--aqua);color:#126b80}.operational-layout{display:grid;grid-template-columns:minmax(0,1.76fr) minmax(320px,.58fr);gap:20px;align-items:start}.panel{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--white);box-shadow:var(--shadow)}.agenda-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px;border-bottom:1px solid var(--line)}.agenda-head h2{margin:0;font-size:16px}.agenda-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.view-toggle{display:flex;border:1px solid #d5e4e6;border-radius:8px;padding:3px;gap:3px}.view-toggle button{border:0;border-radius:5px;background:transparent;color:#64797f;padding:7px 9px;font:800 10px Inter,Arial,sans-serif;cursor:pointer}.view-toggle button.active{background:var(--blue);color:#fff}.week-board-wrap{overflow-x:auto;padding:0 20px 20px}.week-board{display:grid;min-width:980px;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}.week-column{min-height:410px;border-right:1px solid var(--line);background:#fff}.week-column:last-child{border-right:0}.week-column.today{background:linear-gradient(180deg,#f5fcfd 0,#fff 30%)}.week-column-head{min-height:68px;padding:13px 12px 10px;border-bottom:1px solid var(--line);background:#f7fafb}.week-column.today .week-column-head{background:#eaf8fa}.week-column-head strong{display:block;color:#294f58;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.week-column.today .week-column-head strong{color:var(--blue)}.week-column-head span{display:block;margin-top:4px;color:#6b8086;font-size:10px}.week-events{display:grid;align-content:start;gap:8px;padding:10px;min-height:340px}.event-card{display:grid;gap:8px;padding:10px;border:1px solid #d9e6e8;border-left:4px solid var(--accent);border-radius:8px;background:var(--card)}.event-card.confirmado{--accent:#54b57b;--card:#e8f8ee}.event-card.pre_reserva{--accent:#e7bf43;--card:#fff9e3}.event-card.rascunho{--accent:#24a0ba;--card:#ebf8fa}.event-card.conflito{box-shadow:0 0 0 2px #eaad2a4f}.event-card.past{--accent:#aebcc0;--card:#f2f5f5;color:#6e7f84}.event-card-top{display:flex;justify-content:space-between;gap:7px;align-items:flex-start}.event-hour{color:#547078;font-size:10px;font-weight:900}.event-copy h3{margin:0;color:#214e56;font-size:11px;line-height:1.25;text-transform:uppercase}.event-copy p{margin:4px 0 0;color:#657d83;font-size:9px;line-height:1.35}.event-copy small{display:block;margin-top:6px;color:#a05f14;font-size:9px;font-weight:800;line-height:1.35}.event-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.tag{font-size:8px;font-weight:900;white-space:nowrap}.tag-confirmado{color:#216847}.tag-pre_reserva{color:#876712}.tag-rascunho{color:#126b80}.tag-passado{color:#6b7d82}.btn-os,.btn-aval{height:26px;border-radius:6px;padding:0 7px;font:900 9px Inter,Arial,sans-serif;cursor:pointer}.btn-os{border:1px solid #b9dfe3;background:#fff;color:#176174}.btn-aval{border:1px solid #d39928;background:#fff8dc;color:#79560f}.btn-aval.aprovar{border-color:#84c89e;background:#e9f8ef;color:#236748}.vazio-dia{padding:12px 3px;color:#9aabaf;font-size:10px;line-height:1.45;text-align:center}.cal-wrap{padding:0 20px 20px}.calendario{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.dia-semana{padding:10px 4px;background:#f7fafb;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:#65777d;font-size:10px;font-weight:900;text-align:center;text-transform:uppercase}.dia{min-height:104px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.dia.past,.dia.vazio{background:#f4f6f6}.dia.past{color:#849398}.numero-dia{font-size:11px;font-weight:900}.marcador{display:block;overflow:hidden;margin-top:5px;padding:5px;border-radius:5px;font-size:9px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.m-confirmado{background:#dff5e8;color:#216847}.m-pre_reserva{background:#fff0be;color:#886814}.m-rascunho{background:#dff4f7;color:#126b80}.m-passado{background:#e8edef;color:#718086}.aside-head{padding:20px 18px 12px}.aside-title{margin:0;color:#18343e;font-size:16px}.search{position:relative;margin-top:15px}.search input{width:100%;height:40px;padding:0 12px;border:1px solid #cfdee1;border-radius:9px;color:var(--ink);font:12px Inter,Arial,sans-serif}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tab{border:0;border-radius:16px;background:#eef3f4;color:#49646b;padding:7px 10px;font:800 10px Inter,Arial,sans-serif;cursor:pointer}.tab.active{background:var(--blue);color:#fff}.lista-operacional{display:grid;gap:10px;max-height:430px;padding:10px 18px 18px;overflow:auto}.registro{padding:12px;border:1px solid #d9e6e8;border-radius:9px}.registro h3{margin:6px 0;color:#21555a;font-size:12px}.registro p{margin:0;color:#647a80;font-size:10px}.registro.passado{background:#f4f6f6;color:#76878c}.filtros{margin:0 18px 17px;border-top:1px solid #e8eff0;padding-top:12px}.filtros summary{color:#62777d;font-size:10px;font-weight:900;cursor:pointer;text-transform:uppercase}.filtros-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.campo{display:grid;gap:4px;color:#64777d;font-size:9px;font-weight:900;text-transform:uppercase}.campo input,.campo select{height:32px;border:1px solid #d2e0e3;border-radius:6px;padding:0 7px;background:#fff;color:var(--ink);font:11px Inter,Arial,sans-serif}.campo-full{grid-column:span 2}.btn-atualizar{grid-column:span 2;height:33px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:900 11px Inter,Arial,sans-serif;cursor:pointer}.mensagem{margin:0 0 15px;padding:10px 12px;border:1px solid #f0cc77;border-radius:9px;background:#fff9e3;color:#79560f;font-size:12px}.erro{border-color:#f1cbcb;background:#fff7f7;color:#9d4444}.vazio{padding:25px;color:#708389;font-size:12px;text-align:center}.oculto{display:none}@media(max-width:1050px){.operational-layout{grid-template-columns:1fr}.lista-operacional{max-height:none}}@media(max-width:720px){main{padding:22px 13px}.resumo{grid-template-columns:1fr}.agenda-head{align-items:flex-start;flex-direction:column}.week-board-wrap{padding:0 12px 16px}.week-board{min-width:920px}.dia{min-height:62px;padding:4px}.marcador{width:7px;height:7px;margin:4px 0;padding:0;border-radius:50%;font-size:0}.dia-semana{padding:8px 1px;font-size:8px}.filtros-grid{grid-template-columns:1fr}.campo-full,.btn-atualizar{grid-column:span 1}}
  </style>
</head>
<body class="soulink-com-cabecalho">
  {% include '_cabecalho_soulink.html' %}
  <main>
    <header class="page-head"><p class="eyebrow">Visão técnico-operacional</p><h1>Operação</h1><p>Acompanhe a agenda, as reservas e as cotações por data.</p></header>
    <div id="avisos"></div>
    <section class="resumo"><article class="resumo-item resumo-confirmado"><small>Confirmados</small><strong id="qConfirmado">—</strong></article><article class="resumo-item resumo-reserva"><small>Pré-reservas</small><strong id="qPreReserva">—</strong></article><article class="resumo-item resumo-cotacao"><small>Em cotação</small><strong id="qCotacao">—</strong></article></section>
    <section class="operational-layout">
      <section class="panel"><header class="agenda-head"><div><h2 id="tituloAgenda">Agenda dos próximos sete dias</h2><p id="subtituloAgenda">A partir de hoje</p></div><div class="view-toggle"><button id="visaoSemana" class="active" type="button">Próximos 7 dias</button><button id="visaoMes" type="button">Mês</button></div></header><div id="agendaSemana" class="week-board-wrap"></div><div id="agendaMes" class="cal-wrap oculto"><div id="calendario" class="calendario"></div></div></section>
      <aside class="panel"><header class="aside-head"><h2 class="aside-title">Agenda do período</h2><div class="search"><input id="buscaAgenda" type="search" placeholder="Buscar evento, cliente ou local"></div><div class="tabs" id="tabsStatus"><button class="tab active" type="button" data-rapido="todos">Todos</button><button class="tab" type="button" data-rapido="confirmado">Confirmado</button><button class="tab" type="button" data-rapido="pre_reserva">Pré-reserva</button><button class="tab" type="button" data-rapido="rascunho">Cotação</button></div></header><div id="listaOperacional" class="lista-operacional"><div class="vazio">Carregando agenda...</div></div><details class="filtros"><summary>Filtros e período</summary><div class="filtros-grid"><label class="campo"><span>Início</span><input id="inicio" type="date"></label><label class="campo"><span>Fim</span><input id="fim" type="date"></label><label class="campo campo-full"><span>Local</span><select id="filtroLocal"><option value="">Todos os locais</option></select></label><label class="campo campo-full"><span>Responsável</span><select id="filtroResponsavel"><option value="">Todos os responsáveis</option></select></label><button class="btn-atualizar" id="atualizar" type="button">Atualizar agenda</button></div></details></aside>
    </section>
  </main>
  <script>
    const estado={dados:[],resumo:{},rapido:'todos',busca:'',visao:'semana'};const hoje=new Date();hoje.setHours(0,0,0,0);const inicio=document.getElementById('inicio'),fim=document.getElementById('fim'),local=document.getElementById('filtroLocal'),responsavel=document.getElementById('filtroResponsavel'),avisos=document.getElementById('avisos'),busca=document.getElementById('buscaAgenda');const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const data=s=>{const[a,m,d]=String(s||'').split('-').map(Number);return a&&m&&d?new Date(a,m-1,d):null};const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const tipos=i=>i.tipo==='evento'?'evento':i.tipo||'rascunho';const confirmado=i=>['evento','aprovada'].includes(tipos(i));const passado=i=>String(i.data)<iso(hoje);const visual=i=>passado(i)?'passado':confirmado(i)?'confirmado':tipos(i)==='pre_reserva'?'pre_reserva':'rascunho';const rotulo=i=>passado(i)?'Realizado':confirmado(i)?'Confirmado':tipos(i)==='pre_reserva'?'Pré-reserva':'Cotação';
    function periodoSemana(){inicio.value=iso(hoje);const f=new Date(hoje);f.setDate(f.getDate()+6);fim.value=iso(f)}function popular(campo,base,valores){const anterior=campo.value;const unicos=[...new Set(valores.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));campo.innerHTML=`<option value="">${base}</option>${unicos.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}`;if(unicos.includes(anterior))campo.value=anterior}function atende(i){const t=`${i.evento||''} ${i.cliente||''} ${i.local||''}`.toLocaleLowerCase('pt-BR');const r=estado.rapido==='todos'||(estado.rapido==='confirmado'&&confirmado(i))||tipos(i)===estado.rapido;return r&&(!estado.busca||t.includes(estado.busca))&&(!local.value||i.local===local.value)&&(!responsavel.value||i.responsavel===responsavel.value)}function filtrados(){return estado.dados.filter(atende).sort((a,b)=>`${a.data}${a.horario}`.localeCompare(`${b.data}${b.horario}`))}function renderResumo(){const r=estado.resumo||{};document.getElementById('qConfirmado').textContent=(r.evento||0)+(r.aprovada||0);document.getElementById('qPreReserva').textContent=r.pre_reserva||0;document.getElementById('qCotacao').textContent=r.rascunho??r.cotacao??0}
    function botaoAval(i){if(!i.conflito_confirmado||passado(i))return '';const d=i.aval_tecnico?.decisao;if(d==='aprovada')return '<span class="tag tag-confirmado">Aval técnico aprovado</span>';if(d==='ajuste_solicitado')return '<span class="tag tag-pre_reserva">Ajuste solicitado</span>';return `<button class="btn-aval aprovar" data-aval="aprovada" data-numero="${esc(i.numero)}" data-versao="${i.versao||1}">Aprovar técnica</button><button class="btn-aval" data-aval="ajuste_solicitado" data-numero="${esc(i.numero)}" data-versao="${i.versao||1}">Pedir ajuste</button>`}
    function cardEvento(i){return `<article class="event-card ${visual(i)} ${i.conflito_pendente_aval?'conflito':''}"><div class="event-card-top"><span class="event-hour">${esc(i.horario||'A definir')}</span><span class="tag tag-${visual(i)}">${esc(rotulo(i))}</span></div><div class="event-copy"><h3>${esc(i.evento)}</h3><p>${esc(i.local||i.cliente||'Local a definir')}</p>${i.conflito_confirmado?`<small>${esc(i.alerta_operacional||'Aval técnico necessário.')}</small>`:''}</div><div class="event-actions">${botaoAval(i)}${i.pode_gerar_os?`<button class="btn-os" data-os="1" data-origem="${esc(i.origem)}" data-id="${esc(i.id)}" data-numero="${esc(i.numero)}" data-versao="${i.versao||1}">Gerar OS</button>`:''}</div></article>`}
    function renderSemana(){const area=document.getElementById('agendaSemana');const itens=filtrados();let html='<div class="week-board">';for(let n=0;n<7;n++){const dia=new Date(hoje);dia.setDate(hoje.getDate()+n);const chave=iso(dia),doDia=itens.filter(i=>i.data===chave),nome=dia.toLocaleDateString('pt-BR',{weekday:'long'});html+=`<section class="week-column ${n===0?'today':''}"><header class="week-column-head"><strong>${esc(nome)}</strong><span>${dia.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}</span></header><div class="week-events">${doDia.length?doDia.map(cardEvento).join(''):'<div class="vazio-dia">Nenhum evento, pré-reserva ou cotação.</div>'}</div></section>`}area.innerHTML=html+'</div>'}
    function renderMes(){const ref=data(inicio.value)||hoje,primeiro=new Date(ref.getFullYear(),ref.getMonth(),1),grade=new Date(primeiro);grade.setDate(primeiro.getDate()-primeiro.getDay());const por={};filtrados().forEach(i=>(por[i.data]??=[]).push(i));let html=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="dia-semana">${x}</div>`).join('');for(let n=0;n<42;n++){const d=new Date(grade);d.setDate(grade.getDate()+n);const chave=iso(d),itens=por[chave]||[];html+=`<div class="dia ${d.getMonth()!==ref.getMonth()?'vazio':''} ${chave<iso(hoje)?'past':''}"><span class="numero-dia">${d.getDate()}</span>${itens.slice(0,3).map(i=>`<span class="marcador m-${visual(i)}">${esc(i.evento)}</span>`).join('')}</div>`}document.getElementById('calendario').innerHTML=html}
    function renderLista(){const itens=filtrados();document.getElementById('listaOperacional').innerHTML=itens.length?itens.map(i=>`<article class="registro ${passado(i)?'passado':''}"><span class="tag tag-${visual(i)}">${esc(rotulo(i))}</span><h3>${esc(i.evento)}</h3><p>${esc(String(i.data||'').split('-').reverse().join('/'))} · ${esc(i.local||i.cliente||'Local a definir')}</p>${i.conflito_pendente_aval?'<p style="margin-top:6px;color:#9b6313;font-weight:800">Aval técnico pendente</p>':''}</article>`).join(''):'<div class="vazio">Nenhum registro neste filtro.</div>'}
    async function carregar(){document.getElementById('listaOperacional').innerHTML='<div class="vazio">Atualizando agenda...</div>';try{const r=await fetch(`/api/operacional?inicio=${inicio.value}&fim=${fim.value}&externos=1`),d=await r.json();if(!r.ok||!d.sucesso)throw new Error(d.erro||'Não foi possível consultar a agenda.');estado.dados=d.dados||[];estado.resumo=d.resumo||{};popular(local,'Todos os locais',estado.dados.map(i=>i.local));popular(responsavel,'Todos os responsáveis',estado.dados.map(i=>i.responsavel));renderResumo();renderSemana();renderMes();renderLista();avisos.innerHTML=(d.avisos||[]).length?`<div class="mensagem">${esc(d.avisos.join(' '))}</div>`:''}catch(e){avisos.innerHTML=`<div class="mensagem erro">${esc(e.message||'Não foi possível carregar a agenda.')}</div>`;document.getElementById('agendaSemana').innerHTML='';document.getElementById('calendario').innerHTML='';document.getElementById('listaOperacional').innerHTML='<div class="vazio">Não foi possível carregar a agenda.</div>'}}
    async function avaliar(b){const r=await fetch('/api/operacional/avaliacoes-tecnicas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numero:b.dataset.numero,versao:Number(b.dataset.versao),decisao:b.dataset.aval})}),d=await r.json();if(!r.ok||!d.sucesso)throw new Error(d.erro||'Não foi possível registrar a decisão.');await carregar();avisos.innerHTML=`<div class="mensagem">${esc(d.mensagem)}</div>`}document.addEventListener('click',async e=>{const b=e.target.closest('[data-aval]');if(b){try{await avaliar(b)}catch(err){avisos.innerHTML=`<div class="mensagem erro">${esc(err.message)}</div>`}return}const os=e.target.closest('[data-os]');if(os){const u=os.dataset.origem==='soulink'?`/api/operacional/os/proposta/${encodeURIComponent(os.dataset.numero)}/${encodeURIComponent(os.dataset.versao)}`:`/api/operacional/os/evento/${encodeURIComponent(os.dataset.id)}`;window.open(u,'_blank','noopener')}});busca.addEventListener('input',()=>{estado.busca=busca.value.trim().toLocaleLowerCase('pt-BR');renderSemana();renderMes();renderLista()});[local,responsavel].forEach(c=>c.addEventListener('change',()=>{renderSemana();renderMes();renderLista()}));document.getElementById('tabsStatus').addEventListener('click',e=>{const b=e.target.closest('[data-rapido]');if(!b)return;estado.rapido=b.dataset.rapido;document.querySelectorAll('[data-rapido]').forEach(x=>x.classList.toggle('active',x===b));renderSemana();renderMes();renderLista()});document.getElementById('atualizar').addEventListener('click',carregar);document.getElementById('visaoSemana').addEventListener('click',()=>{estado.visao='semana';document.getElementById('agendaSemana').classList.remove('oculto');document.getElementById('agendaMes').classList.add('oculto');document.getElementById('visaoSemana').classList.add('active');document.getElementById('visaoMes').classList.remove('active');document.getElementById('tituloAgenda').textContent='Agenda dos próximos sete dias';document.getElementById('subtituloAgenda').textContent='Hoje e os próximos seis dias'});document.getElementById('visaoMes').addEventListener('click',()=>{estado.visao='mes';document.getElementById('agendaSemana').classList.add('oculto');document.getElementById('agendaMes').classList.remove('oculto');document.getElementById('visaoMes').classList.add('active');document.getElementById('visaoSemana').classList.remove('active');document.getElementById('tituloAgenda').textContent='Calendário mensal';document.getElementById('subtituloAgenda').textContent='Use os filtros para escolher o período'});periodoSemana();carregar();
  </script>
</body>
</html>
