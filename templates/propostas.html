<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLK | Meus Orçamentos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family:'Segoe UI',Arial,sans-serif; }
body { background: #f5f7fa; padding: 15px; color: #333; font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1200px; margin: 0 auto; }

/* ===== CABEÇALHO PADRÃO IGUAL PÁGINA DE EDIÇÃO ===== */
header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 15px; padding: 12px 20px;
    background: linear-gradient(135deg, #00bcd4, #0097a7);
    border-radius: 8px; color: white;
}
header h1 { font-size: 18px; font-weight: 600; }
header a {
    color: white; text-decoration: none; font-size: 13px; margin-left: 15px;
    padding: 6px 12px; border: 1px solid rgba(255,255,255,0.5);
    border-radius: 5px; transition: all 0.2s;
}
header a:hover { background: white; color: #00bcd4; }

.aviso {
    background: #fff3cd; border: 1px solid #ffeaa7;
    color: #856404; padding: 12px 16px; border-radius: 6px;
    margin-bottom: 15px;
}

.card {
    background: #fff; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    border: 1px solid #e8e8e8 !important;
    padding:18px; margin-bottom:15px;
}
h4 { color:#00838f; margin-bottom:8px; font-size:15px; font-weight:600; }
p { margin:4px 0; }
.linha-versao {
    padding:10px 8px; border-bottom:1px solid #e8e8e8;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
}
.btn-pdf {
    display: inline-block; background: #0097a7; color: #fff !important;
    padding: 6px 14px; border-radius: 5px; text-decoration: none !important;
    font-size: 13px; font-weight: 500; transition: all 0.2s;
}
.btn-pdf:hover { background: #007a88; }
.btn-editar {
    background: linear-gradient(135deg,#00bcd4,#0097a7); color:white; border:none;
    padding:5px 12px; border-radius:5px; cursor:pointer;
    font-size:13px; transition: all 0.2s;
}
.btn-editar:hover { background: #008a96; }
.btn-excluir {
    background:#dc3545; color:white; border:none;
    padding:5px 12px; border-radius:5px; cursor:pointer;
    font-size:13px; margin-left:5px; transition: all 0.2s;
}
.btn-excluir:hover { background:#c82333; }
.valor { font-weight:bold; color:#0097a7; }
.versao-tag {
    background:rgba(0,188,212,0.15); color:#006069; font-weight:bold;
    padding:2px 8px; border-radius:12px; font-size:12px;
}
.vazio {
    text-align: center; padding: 60px 20px; color: #888;
    background:white; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.04);
    border:1px solid #e8e8e8;
}
</style>
</head>
<body>
<div class="wrap">

<header>
    <h1>📑 Meus Orçamentos</h1>
    <div>
        <a href="/">🏠 Voltar ao Painel</a>
        <a href="/meus-itens">📦 Itens</a>
    </div>
</header>

<div id="lista-propostas"></div>

</div>

<script>
async function carregarPropostas() {
    const el = document.getElementById("lista-propostas");
    try {
        const res = await fetch("/api/propostas");
        const r = await res.json();
        const lista = r.dados || [];

        if (!lista.length) {
            el.innerHTML = `
            <div class="vazio">
                <h3>Nenhum orçamento gerado ainda 😊</h3>
                <p style="margin-top:8px">Volte ao painel e crie seu primeiro orçamento!</p>
            </div>`;
            return;
        }

        let html = "";
        lista.forEach(item => {
            html += `<div class="card">
                <h4>📌 Orçamento Nº: <strong>${item.numero}</strong></h4>
                <p><strong>Cliente:</strong> ${item.cliente}</p>
                <p><strong>Evento:</strong> ${item.evento}</p>
                <p><strong>Último valor:</strong> <span class="valor">R$ ${parseFloat(item.total||0).toFixed(2).replace(".",",")}</span></p>
                <hr style="margin:10px 0; border-color:#e8e8e8;">
                <p style="font-weight:bold; margin-bottom:6px; color:#00838f;">📜 Histórico de versões:</p>`;

            item.versoes.forEach(v => {
                const valorV = parseFloat(v.total||0).toFixed(2).replace(".",",");

                html += `<div class="linha-versao">
                    <span><span class="versao-tag">v${v.versao}</span> ${v.data} — <strong>R$ ${valorV}</strong></span>
                    <div>
                        ${v.arquivo_pdf ? `<a class="btn-pdf" href="/pdfs/${v.arquivo_pdf}" target="_blank">📄 Ver PDF</a>` : ""}
                        <button class="btn-editar" onclick="irEditar('${item.numero}', ${v.versao}, this)">✏️ Editar</button>
                    </div>
                </div>`;
            });

            html += `
                <div style="margin-top:15px; border-top:1px solid #e8e8e8; padding-top:10px; text-align:right;">
                    <button class="btn-excluir" onclick="excluirProposta('${item.numero}')">🗑️ Excluir Orçamento</button>
                </div>
            </div>`;
        });

        el.innerHTML = html;

    } catch (e) {
        console.error(e);
        el.innerHTML = `<div class="aviso">❌ Erro ao carregar orçamentos. Recarregue a página.</div>`;
    }
}

function irEditar(numProposta, versao, botao){
    fetch("/api/propostas")
        .then(res => res.json())
        .then(r => {
            const lista = r.dados || [];
            const proposta = lista.find(p => p.numero === numProposta);
            
            if (!proposta) {
                alert("Orçamento não encontrado");
                return;
            }

            // ✅ MAPEAMENTO COMPLETO USANDO OS CAMPOS DO BACKEND
            const dadosOrganizados = JSON.stringify({
                evento: {
                    nome_evento: proposta.evento || "",
                    data_evento: proposta.data_evento || "",
                    local_evento: proposta.local_evento || "",
                    qtd_pessoas: proposta.qtd_pessoas || "",
                    nome_vendedor: proposta.nome_vendedor || "",
                    id_vendedor: proposta.id_vendedor || ""
                },
                cliente: {
                    razao_social: proposta.cliente || "",
                    cnpj: proposta.cnpj || "",
                    telefone: proposta.telefone || "",
                    email: proposta.email || "",
                    responsavel: proposta.responsavel || ""
                },
                itens: proposta.itens || []
            });

            localStorage.setItem("editar_numero", numProposta);
            localStorage.setItem("editar_versao", String(versao));
            localStorage.setItem("dados_editar", dadosOrganizados);

            console.log("✅ Dados salvos para edição:", JSON.parse(dadosOrganizados));

            window.location.href = "/editar";
        })
        .catch(e => {
            console.error("Erro ao buscar orçamento:", e);
            alert("Erro ao carregar dados para edição");
        });
}

async function excluirProposta(numero) {
    if (!confirm(`Tem certeza que deseja excluir o orçamento ${numero}? Isso também tentará removê-lo do MeEventos.`)) {
        return;
    }

    try {
        const res = await fetch(`/api/propostas/${numero}`, { method: 'DELETE' });
        const r = await res.json();

        if (r.sucesso) {
            let msg = r.mensagem;
            if (r.detalhe_meeventos) {
                msg += "\n\nStatus MeEventos: " + r.detalhe_meeventos;
            }
            alert(msg);
            carregarPropostas();
        } else {
            alert("Erro ao excluir: " + (r.erro || "Erro desconhecido"));
        }
    } catch (e) {
        console.error(e);
        alert("Erro na requisição de exclusão.");
    }
}

window.onload = carregarPropostas;
</script>

</body>
</html>
